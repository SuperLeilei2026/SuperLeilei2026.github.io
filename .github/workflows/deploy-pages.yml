name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Checkout City Afterimage
        uses: actions/checkout@v6
        with:
          repository: SuperLeilei2026/city-afterimage
          path: .city-afterimage-src
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .city-afterimage-src/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install City Afterimage dependencies
        run: npm ci
        working-directory: .city-afterimage-src
      - name: Build static site
        run: npm run build:pages
      - name: Build City Afterimage subsite
        run: npm run build:pages
        working-directory: .city-afterimage-src
      - name: Add City Afterimage to the profile site
        run: |
          mkdir -p pages-dist/city-afterimage
          cp -R .city-afterimage-src/pages-dist/. pages-dist/city-afterimage/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
