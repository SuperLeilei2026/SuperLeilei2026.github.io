<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e7f3fb" />
    <meta
      name="description"
      content="武汉数命 SPU 城市 AI 接待员的官方功能演示。四项功能都在正式体验页上。"
    />
    <title>武汉数命 SPU 城市 AI 接待员 · 演示视频</title>
    <link rel="icon" href="./favicon.png" />
    <style>
      :root {
        --ink: #172033;
        --muted: #3e4e66;
        --faint: #5d6d84;
        --paper: #eef5fb;
        --accent: #0e4f96;
        --serif: "Songti SC", "STSong", "Source Han Serif SC", "Noto Serif SC", serif;
        --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        min-height: 100dvh;
        color: var(--ink);
        background:
          radial-gradient(900px 420px at 10% -10%, #fff 0%, transparent 60%),
          radial-gradient(700px 380px at 100% 0%, #d5ecfa 0%, transparent 55%),
          var(--paper);
        font-family: var(--sans);
        font-size: 16px;
        line-height: 1.65;
      }
      main {
        width: min(480px, calc(100% - 32px));
        height: 100dvh;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        padding: 20px 0 calc(16px + env(safe-area-inset-bottom));
      }
      .kicker {
        margin: 0 0 8px;
        letter-spacing: 0.12em;
        font-size: 12px;
        font-weight: 700;
        color: var(--accent);
      }
      h1 {
        margin: 0;
        font-family: var(--serif);
        font-size: 26px;
        line-height: 1.3;
        font-weight: 700;
      }
      .note {
        margin: 10px 0 16px;
        color: var(--muted);
        font-size: 15px;
      }
      .stage {
        flex: 1 1 0;
        min-height: 0;
        container-type: size;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #fff;
        border-radius: 22px;
        padding: 8px;
        box-shadow: 0 16px 40px rgba(23, 55, 90, 0.08);
      }
      video {
        display: block;
        width: min(100cqw, calc(100cqh * 9 / 16));
        height: auto;
        aspect-ratio: 9 / 16;
        object-fit: contain;
        background: #0d1520;
        border-radius: 16px;
      }
      footer {
        margin-top: 16px;
        color: var(--faint);
        font-size: 13px;
      }
      footer p { margin: 0 0 4px; }
      a { color: var(--accent); }
      a:focus-visible { outline: 3px solid #8cbcf0; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">#SAIG</p>
      <h1>武汉数命 SPU 城市 AI 接待员 · 演示视频</h1>
      <p class="note">这是官方功能演示，四项功能都在正式体验页上。</p>
      <div class="stage">
        <video
          controls
          playsinline
          preload="metadata"
          width="1080"
          height="1920"
          aria-label="武汉数命 SPU 城市 AI 接待员演示视频"
        >
          <source src="./saig-demo-9x16.mp4" type="video/mp4" />
          <p>当前浏览器不能内嵌播放。<a href="./saig-demo-9x16.mp4">打开演示视频文件</a>。</p>
        </video>
      </div>
      <footer>
        <p>Leinstein</p>
        <p><a href="./">打开体验页</a></p>
      </footer>
    </main>
  </body>
</html>
